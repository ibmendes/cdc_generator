# ---------------------------------------------------------------------------
# Bundle root configuration.
#
# NOTE: You said you already ran a pre-configuration via VS Code, so you
# probably already have a databricks.yml with `bundle.name` and a
# `workspace.host` / auth profile set up. Don't blindly overwrite that file —
# instead:
#   1. Copy the `variables:` and `targets:` blocks below into your existing
#      databricks.yml (merge, don't duplicate the `bundle:` key).
#   2. Add the `include:` line so the resource files in resources/ get picked
#      up automatically.
#   3. Copy the resources/ and src/ folders as-is into your bundle root.
# ---------------------------------------------------------------------------

bundle:
  name: cdc_lakeflow_cert_lab

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog used by this project (must already exist)
    default: depro_v2

  schema:
    description: Schema (database) created by this bundle for the lab
    default: cdc_lab_dev
  volume_name:
    description: Name of the UC Volume used as the CDC landing zone
    default: cdc_landing

  # notification_email:
  #   description: Email address used for job failure notifications
  #   default: your_email@example.com

  batch_size:
    description: Default number of fake customer events generated per job run
    default: "50"

# ---------------------------------------------------------------------------
# Targets = environments. `mode: development` prefixes resource names with
# your username and deploys jobs in a paused/no-schedule state automatically,
# which is exactly what you want while iterating from VS Code.
# ---------------------------------------------------------------------------
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405614145892791.11.azuredatabricks.net/
    variables:
      schema: cdc_lab_dev
    resources:
      pipelines:
        cdc_lakeflow_pipeline:
          development: true
      jobs:
        cdc_orchestration_job:
          schedule:
            quartz_cron_expression: "0 0 * * * ?"
            timezone_id: UTC
            pause_status: PAUSED

  staging:
    mode: production
    workspace:
      host: https://adb-7405614145892791.11.azuredatabricks.net/
    variables:
      schema: cdc_lab_staging
    resources:
      pipelines:
        cdc_lakeflow_pipeline:
          development: false
      jobs:
        cdc_orchestration_job:
          schedule:
            quartz_cron_expression: "0 0 * * * ?"
            timezone_id: UTC
            pause_status: PAUSED

  prod:
    mode: production
    workspace:
      host: https://adb-7405614145892791.11.azuredatabricks.net/
    variables:
      schema: cdc_lab_prod
    resources:
      pipelines:
        cdc_lakeflow_pipeline:
          development: false
      jobs:
        cdc_orchestration_job:
          schedule:
            quartz_cron_expression: "0 0 * * * ?"
            timezone_id: UTC
            pause_status: PAUSED
    permissions:
      - user_name: xigormendes@gmail.com
        level: CAN_MANAGE

